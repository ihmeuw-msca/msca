name: deploy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cibuildwheel can only build wheels for the OS it runs on, so each
        # platform needs its own runner. macos-latest is arm64 (Apple
        # Silicon); macos-15-intel is x86_64 (Intel), supported until fall 2027.
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.0
      with:
        output-dir: dist
      env:
        CIBW_BUILD: "cp311-* cp312-*"
        CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
        CIBW_ARCHS_MACOS: native
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: pytest {project}/tests
    - uses: actions/upload-artifact@v4
      with:
        name: dist-wheels-${{ matrix.os }}
        path: dist/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --outdir dist
    - uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        # Only the build artifacts; the docs job also uploads a
        # github-pages artifact that must not end up in dist.
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: List distributions
      run: ls -l dist
    - name: Publish package distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1.12
      with:
        skip-existing: true
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install .[docs] --upgrade pip
      - name: Generate API docs & Build sphinx documentation
        run: |
          git fetch --tags
          cd docs
          python build.py
          cd ..
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
